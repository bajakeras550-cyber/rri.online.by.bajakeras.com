<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RRI.Online By.Bajakeras</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars"></div>

  <main class="radio-container">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <div class="brand-main">RRI<span>.Online</span></div>
        <div class="brand-sub">By.Bajakeras</div>
      </div>
    </header>

    <!-- MOON -->
    <div class="moon">
      <div class="moon-shadow"></div>
    </div>

    <!-- PLAY AREA -->
    <section class="player-section">

      <div class="play-glow"></div>

      <button id="playButton" class="play-button" aria-label="Putar radio">
        <span id="playIcon">▶</span>
      </button>

      <div id="statusText" class="status">
        Siap mendengarkan
      </div>

    </section>

    <!-- SPECTRUM -->
    <section class="spectrum-section">

      <div class="section-title">
        <span>LIVE SPECTRUM</span>
        <span id="liveIndicator" class="live-indicator">● LIVE</span>
      </div>

      <canvas id="spectrumCanvas"></canvas>

    </section>

    <!-- 10 BAND EQUALIZER -->
    <section class="equalizer-section">

      <div class="section-title">
        <span>10-BAND EQUALIZER</span>
        <button id="resetEq" class="reset-button">RESET</button>
      </div>

      <div class="equalizer">

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="31">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">31</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="62">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">62</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="125">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">125</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="250">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">250</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="500">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">500</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="1000">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">1K</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="2000">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">2K</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="4000">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">4K</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="8000">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">8K</div>
        </div>

        <div class="eq-band">
          <input type="range" min="-12" max="12" value="0" class="eq-slider" data-frequency="16000">
          <div class="eq-value">0 dB</div>
          <div class="eq-frequency">16K</div>
        </div>

      </div>

    </section>

    <!-- VOLUME -->
    <section class="volume-section">

      <div class="volume-icon" id="volumeIcon">🔊</div>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

      <span id="volumeValue">100%</span>

    </section>

    <audio id="radioAudio" preload="none"></audio>

    <footer>
      <div>RRI.Online By.Bajakeras</div>
      <small>LIVE RADIO STREAM</small>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
