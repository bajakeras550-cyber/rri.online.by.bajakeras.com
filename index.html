<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RRI Pro 1 Mataram</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="radio-container">

    <header>
      <div class="logo">RRI</div>
      <div class="title">RADIO ONLINE</div>
    </header>

    <section class="radio-info">

      <div class="live">LIVE</div>

      <h1>RRI</h1>

      <p>Radio Republik Indonesia</p>

      <h2>Pro 1</h2>

      <h3>Mataram</h3>

      <div class="location">
        📍 Mataram, Nusa Tenggara Barat
      </div>

    </section>


    <div id="status">
      Siap diputar
    </div>


    <button id="playButton">
      ▶
    </button>


    <div class="volume-control">

      <span id="volumeIcon">🔊</span>

      <input
        id="volumeSlider"
        type="range"
        min="0"
        max="100"
        value="85"
      >

      <span id="volumeValue">85%</span>

    </div>


    <button id="muteButton">
      🔇
    </button>


    <section class="sound-control">

      <h3>SOUND CONTROL</h3>

      <h2>Equalizer</h2>


      <label>
        BASS
        <span id="bassValue">0 dB</span>
      </label>

      <input
        id="bass"
        type="range"
        min="-12"
        max="12"
        value="0"
      >


      <label>
        MID
        <span id="midValue">0 dB</span>
      </label>

      <input
        id="mid"
        type="range"
        min="-12"
        max="12"
        value="0"
      >


      <label>
        TREBLE
        <span id="trebleValue">0 dB</span>
      </label>

      <input
        id="treble"
        type="range"
        min="-12"
        max="12"
        value="0"
      >


      <p>
        Equalizer 3-band untuk mengatur karakter suara radio.
      </p>

    </section>


    <footer>
      RRI Pro 1 Mataram
    </footer>

  </main>


  <audio id="radioAudio" preload="none"></audio>

  <script src="script.js"></script>

</body>
</html>
